<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pet Lifestyle — Demo</title><style>body{margin:0;background:#f6f5f1;color:#26352e;font:16px system-ui}header{background:#244b40;color:white;padding:20px}main{max-width:850px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button{border:1px solid #aebbb1;background:white;padding:12px;border-radius:12px;cursor:pointer}.active{background:#244b40;color:white}.card{background:white;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 2px 12px #0001}h1{margin:0}h2{margin-top:0}input,select{padding:12px;border:1px solid #ccd3cb;border-radius:9px;max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{background:#eaf0e8;padding:20px;border-radius:14px}.small{color:#66786b;font-size:14px}</style><header><h1>🐾 Your Pet's World</h1><div>Pet lifestyle app • Interactive concept demo</div></header><main><nav class="tabs" id="tabs"></nav><div id="view"></div><p class="small">Sample data only. Places, bookings, orders and payments are not live.</p></main><script>const sections=['Home','Explore','Travel','My Pets','Community','Mystery Boxes'];let current='Home';let saved=[];let pet='Dog';function render(){document.getElementById('tabs').innerHTML=sections.map(x=>'<button class="'+(current===x?'active':'')+'" onclick="current=\''+x+'\';render()">'+x+'</button>').join('');let html='';if(current==='Home')html='<div class="card"><h2>Welcome back!</h2><p>Plan an adventure, manage your pet’s care, or surprise them with a mystery box.</p><div class="grid"><div class="metric">🐕 2 pet profiles</div><div class="metric">📍 '+saved.length+' saved places</div><div class="metric">🎁 New seasonal boxes</div></div></div>';if(current==='Explore')html='<div class="card"><h2>Explore pet-friendly places</h2><input id="placeSearch" placeholder="Search places or categories" oninput="filterPlaces()"><select id="category" onchange="filterPlaces()"><option>All</option><option>Dog Park</option><option>Hotel</option><option>Campground</option><option>Store</option></select><div id="places"></div></div>';if(current==='Travel')html='<div class="card"><h2>Plan a pet-friendly trip</h2><p>Build a sample trip itinerary.</p><input id="destination" placeholder="Destination city"><select id="traveltype"><option>Hotel getaway</option><option>Camping trip</option><option>Day trip</option></select><button onclick="document.getElementById(\'itinerary\').innerHTML=\'<h3>Sample itinerary</h3><p>Morning: dog park stop<br>Afternoon: pet-friendly café<br>Evening: confirm accommodation pet policy before booking.</p>\'">Create sample plan</button><div id="itinerary"></div></div>';if(current==='My Pets')html='<div class="card"><h2>My Pets</h2><div class="grid"><div class="metric"><h3>🐶 Bailey</h3>Golden Retriever • 4 years<p>Vaccines: review due dates</p></div><div class="metric"><h3>🐱 Luna</h3>Domestic Shorthair • 2 years<p>Play goal: 15 minutes</p></div></div><h3>Care journal</h3><input id="note" placeholder="Add a care note"><button onclick="let n=document.getElementById(\'note\');if(n.value){document.getElementById(\'notes\').innerHTML+=\'<p>✓ \'+n.value.replaceAll(\'<\',\'&lt;\')+\'</p>\';n.value=\'\'}}">Save note</button><div id="notes"></div></div>';if(current==='Community')html='<div class="card"><h2>Pet Parent Community</h2><p>🐾 Weekend walking club • Sample event</p><p>🎉 Pet birthday celebration • Sample event</p><p>🐕 Breed discussion and playdate groups • Coming in a future build</p></div>';if(current==='Mystery Boxes')html='<div class="card"><h2>Build a Mystery Box</h2><p>Choose your pet and box style.</p><label>Pet <select id="animal"><option>Dog</option><option>Cat</option></select></label> <label>Box <select id="box"><option>Spoiled Rotten</option><option>Busy Body</option><option>Chaos Coordinator</option><option>New Kid</option></select></label> <label>Delivery <select id="frequency"><option>One-time</option><option>Monthly</option><option>Quarterly</option></select></label><p><label><input type="checkbox" id="toysonly"> Toys only</label></p><button onclick="document.getElementById(\'boxResult\').textContent=\'Your sample box: \'+document.getElementById(\'animal\').value+\' • \'+document.getElementById(\'box\').value+\' • \'+document.getElementById(\'frequency\').value+(document.getElementById(\'toysonly\').checked?\' • No edible items\':\'\')">Preview selection</button><p id="boxResult"></p><p class="small">Checkout is intentionally disabled.</p></div>';document.getElementById('view').innerHTML=html;if(current==='Explore')filterPlaces()}const places=[['Riverside Dog Park','Dog Park'],['Paws & Stay Hotel','Hotel'],['Pine Trail Campground','Campground'],['The Friendly Market','Store']];function filterPlaces(){let q=document.getElementById('placeSearch').value.toLowerCase(),c=document.getElementById('category').value;document.getElementById('places').innerHTML=places.filter(p=>(c==='All'||p[1]===c)&&p.join(' ').toLowerCase().includes(q)).map(p=>'<div class="metric" style="margin-top:12px"><b>'+p[0]+'</b><p>'+p[1]+' • Fictional sample listing</p><button onclick="saved.push(\''+p[0]+'\');this.textContent=\'Saved ✓\'">Save place</button></div>').join('')||'<p>No matching sample listings.</p>'}render();</script></html>
